<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1060" viewBox="0 0 1030 1060" font-size="14px" fill="#172b4d" role="img" aria-labelledby="title desc">
  <title id="title">Current Local: separate registry and MCP client lanes</title>
  <desc id="desc">Local uses five participating roles: Copilot Chat, VS Code MCP registry, VS Code MCP client, MCP server, and the VS Code extension. Extension activation registers the provider with the registry. Before connecting, the VS Code client triggers provider resolution, which starts the private server and returns its URI and credential. Named tool calls then reach the extension command handler.</desc>
  <style>text{font-family:Arial,sans-serif}.title{font-size:23px;font-weight:700}.name{font-size:16px;font-weight:700}.small{font-size:12px;fill:#53657d}.section{font-size:13px;font-weight:700;fill:#53657d;letter-spacing:1px}.note{fill:#a64200;font-weight:700}.lane{stroke:#b7c6d8;stroke-dasharray:4 5}.setup{stroke:#2563eb;stroke-width:2;stroke-dasharray:7 4;fill:none}.call{stroke:#087f5b;stroke-width:2;fill:none}.result{stroke:#087f5b;stroke-width:2;stroke-dasharray:3 4;fill:none}</style>
  <rect width="1030" height="1060" fill="#fff"/>
  <text x="25" y="35" class="title">Current implementation: Local</text>
  <text x="25" y="61">Local asks the extension for its address, then sends MCP requests as HTTP over a Unix socket.</text>
  <rect x="615" y="86" width="390" height="865" rx="12" fill="#f1f7ff" stroke="#c5daf4"/>
  <text x="810" y="108" text-anchor="middle" class="small">SERVER + HANDLERS SHARE THE EXTENSION HOST</text>
  <rect x="20" y="125" width="160" height="90" rx="8" fill="#f3f5f8" stroke="#c6d0df"/>
  <text x="100" y="155" text-anchor="middle" class="name">Copilot Chat</text>
  <text x="100" y="181" text-anchor="middle" class="small">UI using Local</text>
  <rect x="210" y="125" width="180" height="90" rx="8" fill="#e0eeff" stroke="#96b8e5"/>
  <text x="300" y="150" text-anchor="middle" class="name">VS Code</text>
  <text x="300" y="171" text-anchor="middle" class="name">MCP registry</text>
  <text x="300" y="197" text-anchor="middle" class="small">Connection instructions</text>
  <rect x="415" y="125" width="180" height="90" rx="8" fill="#e5f6ee" stroke="#83b99e"/>
  <text x="505" y="150" text-anchor="middle" class="name">VS Code</text>
  <text x="505" y="171" text-anchor="middle" class="name">MCP client</text>
  <text x="505" y="197" text-anchor="middle" class="small">Sends tool requests</text>
  <rect x="630" y="125" width="150" height="90" rx="8" fill="#e0eeff" stroke="#96b8e5"/>
  <text x="705" y="155" text-anchor="middle" class="name">MCP server</text>
  <text x="705" y="181" text-anchor="middle" class="small">Receives tool requests</text>
  <rect x="820" y="125" width="170" height="90" rx="8" fill="#e0eeff" stroke="#96b8e5"/>
  <text x="905" y="155" text-anchor="middle" class="name">VS Code extension</text>
  <text x="905" y="181" text-anchor="middle" class="small">Runs CoR actions</text>
  <path d="M100 215V940 M300 215V940 M505 215V940 M705 215V940 M905 215V940" class="lane"/>
  <text x="25" y="242" class="section">SETUP: TELL VS CODE HOW TO CONNECT</text>
  <path d="M905 276H300" class="setup"/>
  <text x="602" y="264" text-anchor="middle">VS Code API: registerMcpServerDefinitionProvider(...)</text>
  <path d="M300 318H905" class="setup"/>
  <text x="602" y="306" text-anchor="middle">VS Code callback: provideMcpServerDefinitions()</text>
  <path d="M905 360H300" class="setup"/>
  <text x="602" y="348" text-anchor="middle">Callback return: placeholder address http://invalid.invalid</text>
  <path d="M300 402H505" class="setup"/>
  <text x="402" y="382" text-anchor="middle">Pass connection settings</text>
  <text x="402" y="397" text-anchor="middle" class="small">VS Code internal API, not HTTP</text>
  <path d="M505 446H905" class="setup"/>
  <text x="705" y="426" text-anchor="middle">VS Code callback: resolveMcpServerDefinition(...)</text>
  <text x="705" y="441" text-anchor="middle" class="small">Ask the extension to start the server and fill in its address</text>
  <path d="M905 488H705" class="setup"/>
  <text x="805" y="468" text-anchor="middle">Start socket server</text>
  <text x="805" y="483" text-anchor="middle" class="small">JS: startInProcHttpServer(...)</text>
  <path d="M705 530H905" class="setup"/>
  <text x="805" y="510" text-anchor="middle">Return address + secret</text>
  <text x="805" y="525" text-anchor="middle" class="small">JavaScript return value</text>
  <path d="M905 572H505" class="setup"/>
  <text x="705" y="552" text-anchor="middle">Callback return: socket address + Authorization header</text>
  <text x="705" y="567" text-anchor="middle" class="small">Address format: unix:/.../mcp.sock#/mcp</text>
  <path d="M505 614H705" class="setup"/>
  <text x="605" y="594" text-anchor="middle">Start MCP: HTTP POST /mcp</text>
  <text x="605" y="609" text-anchor="middle" class="small">Unix socket /.../mcp.sock</text>
  <text x="25" y="651" class="section">EXAMPLE: ASK THE EXTENSION TO OPEN NEXT STEPS</text>
  <path d="M100 695H505" class="call"/>
  <text x="302" y="675" text-anchor="middle">Request open_scaffold_next_steps_view</text>
  <text x="302" y="690" text-anchor="middle" class="small">VS Code internal tool service</text>
  <path d="M505 729H705" class="call"/>
  <text x="605" y="709" text-anchor="middle">HTTP POST /mcp</text>
  <text x="605" y="724" text-anchor="middle" class="small">Via /.../mcp.sock: tools/call</text>
  <path d="M705 771H905" class="call"/>
  <text x="805" y="751" text-anchor="middle">Call the tool implementation</text>
  <text x="805" y="766" text-anchor="middle" class="small">JavaScript function call, no network</text>
  <rect x="813" y="789" width="185" height="66" rx="7" fill="#fff4e8" stroke="#e7af70"/>
  <text x="905" y="811" text-anchor="middle" class="note">Extension action</text>
  <text x="905" y="831" text-anchor="middle">Open requested screen</text>
  <text x="905" y="847" text-anchor="middle" class="small">Approval checks vary by tool</text>
  <path d="M905 879H705 M705 905H505 M505 931H100" class="result"/>
  <text x="805" y="873" text-anchor="middle" class="small">JavaScript return value</text>
  <text x="605" y="899" text-anchor="middle" class="small">HTTP response over Unix socket</text>
  <text x="302" y="925" text-anchor="middle" class="small">VS Code internal tool service: show result in Chat</text>
  <g id="arrowheads">
    <g fill="#2563eb">
      <polygon points="300,276 312,270 312,282"/>
      <polygon points="905,318 893,312 893,324"/>
      <polygon points="300,360 312,354 312,366"/>
      <polygon points="505,402 493,396 493,408"/>
      <polygon points="905,446 893,440 893,452"/>
      <polygon points="705,488 717,482 717,494"/>
      <polygon points="905,530 893,524 893,536"/>
      <polygon points="505,572 517,566 517,578"/>
      <polygon points="705,614 693,608 693,620"/>
    </g>
    <g fill="#087f5b">
      <polygon points="505,695 493,689 493,701"/>
      <polygon points="705,729 693,723 693,735"/>
      <polygon points="905,771 893,765 893,777"/>
      <polygon points="705,879 717,873 717,885"/>
      <polygon points="505,905 517,899 517,911"/>
      <polygon points="100,931 112,925 112,937"/>
    </g>
  </g>
  <text x="25" y="976">HTTP uses /mcp over /.../mcp.sock, not a TCP port. The socket path is illustrative.</text>
  <text x="25" y="1000">Requests need an Authorization secret. Directory mode 0700 allows only its owner to access the socket directory.</text>
  <text x="25" y="1024">API/callback arrows pass VS Code settings, not MCP traffic. Columns show roles, not one process per column.</text>
  <text x="25" y="1047" class="small">Blue: setup. Green: tool request. Dotted green: reply over the labeled connection. The server is not another executable.</text>
</svg>
