<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-size="16px" fill="#172b4d" role="img" aria-labelledby="title desc">
  <title id="title">Copilot MCP client to loopback MCP server transport</title>
  <desc id="desc">Copilot's MCP client sends an authenticated HTTP POST request over TCP to an ephemeral port on 127.0.0.1. The MCP server checks the nonce, Host and Origin headers, request size and connection limits. The response returns over the loopback TCP connection.</desc>
  <style>text{font-family:Arial,sans-serif}.title{font-size:24px;font-weight:700}.name{font-size:18px;font-weight:700}.small{font-size:14px;fill:#42546c}.request{stroke:#087f5b;stroke-width:3;fill:none}.reply{stroke:#087f5b;stroke-width:3;stroke-dasharray:5 5;fill:none}.note{fill:#934100;font-weight:700}</style>
  <rect width="1100" height="470" fill="#fff"/>
  <text x="25" y="40" class="title">Phase 2: send MCP JSON-RPC as HTTP over loopback TCP</text>
  <rect x="55" y="105" width="285" height="115" rx="10" fill="#e5f6ee" stroke="#83b99e" stroke-width="2"/>
  <text x="197" y="145" text-anchor="middle" class="name">Copilot MCP client</text>
  <text x="197" y="177" text-anchor="middle" class="small">HTTP client</text>
  <text x="197" y="200" text-anchor="middle" class="small">Uses the registered URL and nonce</text>
  <rect x="760" y="82" width="285" height="166" rx="12" fill="#f1f7ff" stroke="#c5daf4" stroke-width="2"/>
  <text x="902" y="107" text-anchor="middle" class="small">VS CODE EXTENSION HOST PROCESS</text>
  <rect x="787" y="122" width="230" height="100" rx="8" fill="#e0eeff" stroke="#96b8e5" stroke-width="2"/>
  <text x="902" y="158" text-anchor="middle" class="name">MCP server</text>
  <text x="902" y="187" text-anchor="middle" class="small">TCP listener on 127.0.0.1</text>
  <text x="902" y="208" text-anchor="middle" class="small">Temporary OS-selected port</text>
  <path d="M340 130H760" class="request"/>
  <polygon points="760,130 744,122 744,138" fill="#087f5b"/>
  <text x="550" y="77" text-anchor="middle">HTTP POST /mcp over TCP</text>
  <text x="550" y="99" text-anchor="middle" class="small">127.0.0.1:54321, Authorization: Nonce &lt;secret&gt;</text>
  <text x="550" y="120" text-anchor="middle" class="small">Body example: {"method":"tools/call", ...}</text>
  <path d="M760 205H340" class="reply"/>
  <polygon points="340,205 356,197 356,213" fill="#087f5b"/>
  <text x="550" y="252" text-anchor="middle">HTTP response over the same loopback TCP connection</text>
  <rect x="100" y="292" width="900" height="120" rx="8" fill="#fff4e8" stroke="#e7af70"/>
  <text x="550" y="322" text-anchor="middle" class="note">The listener is local to this machine, but any local process can try the port.</text>
  <text x="550" y="348" text-anchor="middle">The server checks the nonce, Host and Origin headers, request size and connection limits.</text>
  <text x="550" y="374" text-anchor="middle">These checks do not isolate malicious software already running as the same OS user.</text>
  <text x="550" y="399" text-anchor="middle" class="small">Binding to 0.0.0.0 or a LAN address would create a different security model.</text>
  <text x="25" y="454" class="small">Solid green: request. Dotted green: reply. Loopback TCP does not use a Unix-socket filesystem path.</text>
</svg>
