name: Vally Agent Evals

on:
  # Run per-agent evals on PRs that touch agent instructions
  pull_request:
    branches: [main, feat/CoR]
    paths:
      - 'resources/agents/**'
      - 'evals/**'
      - '.vally.yaml'

  # Run full suite (chains + per-agent) nightly
  schedule:
    - cron: '0 6 * * *' # 6am UTC daily

  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (project-plan, chains, or all)'
        required: false
        default: 'all'

env:
  NODE_VERSION: '22'

jobs:
  per-agent-evals:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `copilot-requests: write` lets the built-in GITHUB_TOKEN authenticate the
    # Copilot CLI, so the evals need no personal access token or repository secret.
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install eval dependencies
        run: npm ci
        working-directory: evals

      - name: Add Vally CLI to PATH
        run: echo "$GITHUB_WORKSPACE/evals/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check agent instruction drift
        run: node evals/check-agent-drift.mjs

      # Graders run straight off TypeScript source, so a type error is a broken
      # grader — catch it before it costs a full eval run.
      - name: Type-check evals
        run: npm run typecheck
        working-directory: evals

      # Prove the graders still detect the regressions they claim to detect.
      - name: Certify graders
        run: npm run eval:cor:graders:certify

      - name: Validate release thresholds
        run: npm run eval:cor:thresholds:validate

      - name: Lint eval specs
        run: vally lint

      # A missing or wrong-format token still lets the run start, then fails every
      # trial with an opaque SDK error ~25 minutes later. Check it here so the cause
      # is obvious and cheap to see.
      - name: Verify Copilot credentials
        run: node evals/check-copilot-auth.mjs
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_EVAL_TOKEN || github.token }}

      # Half the graders assert a gate tool was called. If the MCP server can't reach
      # the agent, those fail 15 minutes later looking like agent regressions, so
      # confirm the tools are actually there first.
      - name: Verify workflow-tools MCP server
        run: node evals/check-mcp-tools.mjs
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_EVAL_TOKEN || github.token }}

      - name: Run project-plan evals
        run: node evals/run-eval.cjs --suite project-plan --output-dir ./results/pr/project-plan
        env:
          # The built-in token authenticates because the job requests
          # `copilot-requests: write`. COPILOT_EVAL_TOKEN is an optional override
          # for a fine-grained PAT and does not need to exist.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_EVAL_TOKEN || github.token }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vally-results-${{ github.sha }}
          path: results/
          retention-days: 30

  compare-to-baseline:
    needs: per-agent-evals
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install eval dependencies
        run: npm ci
        working-directory: evals

      - name: Add Vally CLI to PATH
        run: echo "$GITHUB_WORKSPACE/evals/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download PR results
        uses: actions/download-artifact@v4
        with:
          name: vally-results-${{ github.sha }}
          path: results/pr

      - name: Download baseline results
        id: download-baseline
        uses: actions/download-artifact@v4
        with:
          # Most recent artifact from main branch — you'd configure this
          # with a separate baseline-publish step or use a fixed artifact name
          name: vally-baseline-main
          path: results/main
        continue-on-error: true

      - name: Compare (fail on regression)
        if: steps.download-baseline.outcome == 'success'
        run: |
          vally compare \
            --baseline results/main/project-plan \
            --treatment results/pr/project-plan \
            --fail-on-regression

  nightly-chain-evals:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'project-plan')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install eval dependencies
        run: npm ci
        working-directory: evals

      - name: Add Vally CLI to PATH
        run: echo "$GITHUB_WORKSPACE/evals/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check agent instruction drift
        run: node evals/check-agent-drift.mjs

      - name: Verify Copilot credentials
        run: node evals/check-copilot-auth.mjs
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_EVAL_TOKEN || github.token }}

      - name: Run all per-agent evals (5 trials)
        run: node evals/run-eval.cjs --suite project-plan --runs 5 --output-dir ./results/nightly/project-plan
        env:
          # The Copilot CLI reads COPILOT_GITHUB_TOKEN before GH_TOKEN/GITHUB_TOKEN.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_EVAL_TOKEN || github.token }}

      # TODO: Add chain evals once chain eval.yaml is implemented
      # - name: Run chain evals
      #   run: |
      #     vally eval \
      #       --eval-spec evals/chains/eval.yaml \
      #       --output-dir ./results/nightly/chains \
      #       --runs 3 \
      #       --verbose

      - name: Upload nightly results as baseline
        uses: actions/upload-artifact@v4
        with:
          name: vally-baseline-main
          path: results/nightly/
          retention-days: 90
          overwrite: true

      - name: Compare to previous nightly
        run: |
          vally compare \
            --baseline results/previous \
            --treatment results/nightly/project-plan \
            --output results/nightly/comparison.jsonl \
            --verbose
        continue-on-error: true
