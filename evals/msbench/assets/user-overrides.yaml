# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/vscode-copilot-evaluation/main/doc/references/TestConfig.schema.json

# The `photo-app-requirements` stimulus from evals/project-plan/eval.yaml, run
# against real VS Code on MSBench instead of the Copilot SDK.
#
# Staged as `user-overrides.yaml`, which is the LAST of three config layers
# (base -> benchmark instance -> user overrides, see scripts/run-agent.sh in
# microsoft/vscode-copilot-evaluation). Merging is a shallow Object.assign, so
# the `promptSteps` below wholly replace those of whichever instance we borrow
# — that is what lets us reuse the `say_hello` container image rather than
# publishing one of our own.
#
# `installExtensions` is the exception: it concatenates and de-dupes by id
# across layers, so our extension installs alongside github.copilot-chat.
#
# Run it with ./run.sh — see README.md.

modelSelector:
  id: claude-sonnet-4.5
  vendor: copilot

installExtensions:
  - id: ms-azuretools.vscode-azureresourcegroups
    mode: vsix
    # Container path. Everything under ./assets is copied to /agent/assets, and
    # unlike a benchmark config this path is NOT rewritten, so it is hardcoded.
    path: /agent/assets/extensions/vscode-azureresourcegroups.vsix

# The agent under test. It ships inside the VSIX via contributes.chatAgents, but
# custom modes are resolved from the workspace's .github/agents, so the script
# below seeds it there too.
chatMode: azure-project-plan

# The Vally executor approves every permission request. Without this the
# webview-opening tools block on a confirmation nothing can answer.
dangerouslyAutoApproveAllToolCalls: true

# Seed the agent definition into the workspace, unpacked from the VSIX we just
# installed rather than cloned from GitHub. That keeps the instructions exactly
# in step with the build under test — cloning a branch would let the two drift,
# and silently grade the wrong version of the prompt.
script: |
  set -eux
  VSIX=/agent/assets/extensions/vscode-azureresourcegroups.vsix
  rm -rf /tmp/corext && mkdir -p /tmp/corext
  unzip -q -o "$VSIX" 'extension/resources/agents/*' -d /tmp/corext
  mkdir -p /workspace/.github/agents
  cp -r /tmp/corext/extension/resources/agents/. /workspace/.github/agents/
  ls -la /workspace/.github/agents/

promptSteps:
  - text: |
      I'd like to create an app where you can upload photos and they get stored
      with metadata like who uploaded them and when. I want a nice React frontend
      and an Azure Functions backend with PostgreSQL for the data. Make it with
      full test coverage.
    assertions:
      # vally: file-exists .azure/requirements.json
      - comment: Agent should have written the requirements artifact
        query: SELECT COUNT(*) > 0 FROM files WHERE path LIKE '%.azure/requirements.json'

      # Partial stand-in for the `requirements-schema-valid` program grader, which
      # needs a repo checkout in the container. Catches a malformed artifact; the
      # full contract check lands next as an `exec:` assertion.
      - comment: requirements.json should be valid JSON carrying a questions array
        query: >-
          SELECT COUNT(*) > 0 FROM files
          WHERE path LIKE '%.azure/requirements.json'
            AND json_valid(content)
            AND json_array_length(json_extract(content, '$.questions')) > 0

      # vally: file-not-exists (no-dotfile-requirements)
      - comment: Agent should not have written the dotfile variant
        query: SELECT COUNT(*) = 0 FROM files WHERE path LIKE '%.azure/.requirements.json'

      # vally: tool-calls required [workflow-tools-open_requirements_view]
      # Satisfied here by the extension's real in-process MCP server.
      - comment: Agent should have opened the requirements webview
        query: SELECT COUNT(*) > 0 FROM toolCalls WHERE tool LIKE '%open_requirements_view%'

      # vally: file-not-exists (no-premature-plan) — the approval gate
      - comment: Agent should not have generated a plan before requirements were confirmed
        query: SELECT COUNT(*) = 0 FROM files WHERE path LIKE '%.azure/project-plan.md'

      # vally: transcript-not-contains "What language"
      # `llm_responses.response` is user-facing prose only — it excludes tool output
      # and thinking blocks, so this cannot false-match text the agent merely read.
      - comment: Agent should ask structured questions in the webview, not in chat
        query: SELECT COUNT(*) = 0 FROM llm_responses WHERE response LIKE '%What language%'

      # vally: constraints.reject_tools [vscode_askQuestions]
      - comment: Agent should not fall back to the chat question tool
        query: SELECT COUNT(*) = 0 FROM toolCalls WHERE tool LIKE '%askQuestion%'
