# The first stack the eval container can run end to end.
#
# Both existing stacks declare a gap they cannot close. `react-functions-postgres`
# loses all five runtime-* gates to a missing `func`, and run 2026082682123151
# measured why that is not a quick fix: the install dies on npm E401 because the
# container's registry wants credentials the run does not have.
# `node-express-postgres` gets two runtime gates and loses `runtime-crud`, because
# a round-trip needs a database server and there is no Docker.
#
# This stack has `knownGaps: []`, and that empty list is the entire point of the
# file. Nothing here needs a binary the container lacks:
#
#   - a Node API rather than Azure Functions, so `func` is irrelevant. The
#     runtime target chain resolves `scripts.start` for a Node project, and
#     `detectFunctionsProject` only stands down when `@azure/functions` or a
#     `host.json` is present.
#   - persistence in a file rather than a service, so `runtime-crud` can actually
#     exercise a write and a read back. gates.yaml already says this is the only
#     shape where it can: "A project storing in memory is the one shape where this
#     gate can currently go green at all."
#
# So this is the stack that turns the runtime gates from a documented 0-for-N into
# a measurement. That is worth having even though it is not the flagship shape:
# a gate nobody has ever seen pass is a gate nobody should trust, and proving the
# mechanism on a runnable shape is what makes a later red on the Functions shape
# mean something about the product rather than about the container.
#
# ## What it deliberately does not claim
#
# Users build React + Azure Functions + PostgreSQL. This is not that, and it must
# not be quoted as coverage of it. It covers the debug and runtime *gates*, on a
# shape chosen because the container can execute it.
#
# ## Why `phases: [plan]`, when the point of this stack is the runtime gates
#
# Two things have to be true before this stack can drive a local-dev run, and only
# one of them is.
#
# The first was a scaffold setup turn: `renderStimulus` used to emit exactly one
# prompt step, while local-dev needs `chatMode: azure-project-scaffold` first so
# there is a project on disk for the debug agent to scan. That is now solved —
# `config/phases/local.yaml` declares it as `# turn-before:`, and the phase file
# owns the turn shape for hand-written and generated stimuli alike.
#
# The second is a seed whose plan describes *this* stack, and that does not exist
# yet. The only seeded plan today is `approved-fullstack`: React + Azure Functions
# + PostgreSQL + Blob Storage, which is `react-functions-postgres`, not this file.
# Declaring `local` here was tried, and the result was exactly what the mismatch
# predicts — the scaffold turn built a Functions project, and all five runtime
# gates reported `functionsHostUnavailable` on a stack whose entire premise is
# that it uses no Functions at all (run 2026082867546686).
#
# The fix is NOT a second checked-in fixture. A hand-maintained plan per stack is
# the drift `harvest-seed.ts` exists to prevent: edit the planner's template and
# every stored copy still describes the old shape. The supported path is already
# here — this stack declares the plan phase, so run it, then harvest that run's
# real `.azure/project-plan.md` as this stack's seed. Real planner output, for
# this stack's own prompt, with provenance and a staleness check attached.
#
# Until that seed exists, `knownGaps: []` below is a claim about *wiring* — all
# ten local gates wire with nothing declared not-applicable — and not yet a claim
# that they pass.

schemaVersion: 1
id: react-express-file
name: React SPA with a Node API persisting to a file
ecosystem: node

# Describes the app and nothing else — no artifact names, no agent names, no
# mention of the guided flow — so the same prompt is usable unchanged by a
# baseline arm where plain Copilot builds it. The file-persistence requirement is
# stated as a user would state it ("I don't want to run a database") rather than
# as a technical instruction, because that is what a real request looks like and
# what the planner has to interpret.
prompt: |
  I'd like a project tracker with a React frontend and a Node API. I want to see
  a list of projects, add a new one with a name and a status, and have it still
  be there after a restart. Keep the data in a file on disk — I don't want to run
  a database for something this small. It should also expose a health endpoint so
  I can tell when it is up.

project:
  frontend: spa
  api: http
  # `none` is the honest value and it is not the same as "no persistence". It
  # means no Azure datastore *service*, which is exactly what the prompt asks
  # for. The runtime CRUD probe stands down on container-requiring datastore
  # packages (`pg`, `mongodb`, `redis`, …), and a file-backed store is none of
  # them — see CONTAINER_DATASTORE_PACKAGES in src/runtime/runtimeGates.ts.
  datastore: none
  hosting: appService
  # Both declared because the prompt asks for both. Declaring healthPath is what
  # passes `--require-health` to the gate, which turns "no health endpoint found"
  # from an outOfScope pass into a real verdict.
  healthPath: /api/health
  collectionRoute: /api/projects

runtime:
  # Both present in the container, which is the property this whole file is built
  # on. Listing anything else would get the stack refused, and rightly.
  binaries: [node, npm]
  # No `start:` block. Rungs 1 and 2 of the discovery chain in
  # src/runtime/runtimeTarget.ts (launch.json, then package.json `scripts.start`)
  # answer correctly for a Node project, and a declared command here would have
  # to guess the directory layout the agent picks — replacing working discovery
  # with an assumption.

# Empty, and asserted rather than omitted: there is no gate in this table that
# this stack wires and cannot answer. If a run proves otherwise, the finding
# belongs here as an entry rather than in someone's memory.
knownGaps: []

phases: [plan]
