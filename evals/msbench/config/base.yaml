# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/vscode-copilot-evaluation/main/doc/references/TestConfig.schema.json

# Shared preamble for every stimulus.
#
# `build-config.ts <stimulus>` concatenates this file with one file from
# `stimuli/` to produce `assets/user-overrides.yaml`, which is the LAST of three
# config layers (base -> benchmark instance -> user overrides, see
# scripts/run-agent.sh in microsoft/vscode-copilot-evaluation). Merging is a
# shallow Object.assign, so the stimulus's `promptSteps` wholly replace those of
# whichever instance we borrow — that is what lets us reuse the `say_hello`
# container image rather than publishing one of our own.
#
# `installExtensions` is the exception: it concatenates and de-dupes by id across
# layers, so our extension installs alongside github.copilot-chat.
#
# Why the split: run-agent.sh hardcodes `cp "$PWD/user-overrides.yaml"`, so the
# agent will only ever read that one filename and a stimulus cannot be selected
# with a flag. And `promptSteps` feeds a *single* chat session, so the four
# stimuli cannot be stacked into one file either — a later stimulus would see
# the requirements.json an earlier one wrote, and `no-premature-plan` would fail
# spuriously. One run per stimulus is therefore forced; keeping the preamble
# here means the VSIX path and the agent-seeding script have exactly one
# definition instead of four copies drifting apart.
#
# Run it with ./run.sh — see README.md.

# Also the queueing key. CES serialises runs sharing the same (model, endpoint tag),
# and the model half of that key is read from here: `--model .` makes the vscode
# plugin resolve the model from this block rather than from the CLI flag. Changing
# `id` therefore moves our runs into a different queue — see README.md, "Run queueing".
modelSelector:
  id: claude-sonnet-4.5
  vendor: copilot

# Set explicitly because the defaults (6300 / 2700 / 300) are sized for a
# single-turn run, and the end-to-end chain is not one.
#
# NOTE: these are the *in-config* timeouts, enforced by the agent and the
# platform runner. They are unrelated to `msbench-cli run --timeout`, which is a
# purely local wait — see README.md, "Timeouts". Do not add that flag.
timeouts:
  # describe -> requirements -> plan -> scaffold -> build -> run -> debug, all in
  # ONE chat session. 1h45m is a per-turn budget, not a budget for the chain.
  #
  # Budget, NOT an independent knob. The agent clock starts *after* the job clock
  # (container pull, VS Code + VSIX install, workspace setup, the `script:`
  # preamble all precede the first turn), so agentSeconds must leave room for
  # both that head start and the grace period below — otherwise the job is killed
  # first, the agent timeout never fires, runnerGraceSeconds never runs, and
  # nothing is flushed on exactly the runs that need diagnosing:
  #
  #   6h job cap - ~15m setup - 15m grace => 5h agent, with margin
  #
  # Re-derive this if the cap is ever confirmed. GitHub documents a 6h cap for
  # hosted runners and 5 days for self-hosted; runs report `dispatched to GitHub
  # Actions` with run_platform='linux_container', but we could NOT verify which
  # pool MSBench uses — that is decided by a server-side workflow we cannot read.
  # 6h is assumed because it is the safer of the two. Raising it needs
  # confirmation from CodeExService@microsoft.com.
  agentSeconds: 18000 # 5h
  # The trap. This is not agent inactivity — it fires only when the agent trace,
  # the CAPI proxy log, the Copilot Chat log AND workspace file activity are all
  # quiet. `npm install`, `azd provision`, a build or a test suite produce none
  # of those four for minutes at a time, so a perfectly healthy run gets killed
  # for looking idle. Quiet is not the same as stuck.
  stallSeconds: 5400 # 90m
  # Time the outer runner allows for cleanup after the agent timeout. A long
  # session has far more to flush than a 5-step one (screen recording,
  # trajectory, session.sqlite), and a truncated artifact is an unreadable
  # result — the run cost is paid either way, so buy the flush.
  runnerGraceSeconds: 900 # 15m

installExtensions:
  - id: ms-azuretools.vscode-azureresourcegroups
    mode: vsix
    # Container path. Everything under ./assets is copied to /agent/assets, and
    # unlike a benchmark config this path is NOT rewritten, so it is hardcoded.
    path: /agent/assets/extensions/vscode-azureresourcegroups.vsix

# The agent under test. It ships inside the VSIX via contributes.chatAgents, but
# custom modes are resolved from the workspace's .github/agents, so the script
# below seeds it there too.
chatMode: azure-project-plan

# The Vally executor approves every permission request. Without this the
# webview-opening tools block on a confirmation nothing can answer.
dangerouslyAutoApproveAllToolCalls: true

# Seed the agent definition into the workspace, unpacked from the VSIX we just
# installed rather than cloned from GitHub. That keeps the instructions exactly
# in step with the build under test — cloning a branch would let the two drift,
# and silently grade the wrong version of the prompt.
script: |
  set -eux
  VSIX=/agent/assets/extensions/vscode-azureresourcegroups.vsix
  rm -rf /tmp/corext && mkdir -p /tmp/corext
  unzip -q -o "$VSIX" 'extension/resources/agents/*' -d /tmp/corext
  mkdir -p /workspace/.github/agents
  cp -r /tmp/corext/extension/resources/agents/. /workspace/.github/agents/
  ls -la /workspace/.github/agents/
