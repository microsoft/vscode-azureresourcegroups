# Red-team prompt 18 (category E — naive / out-of-scope), from
# `copilot-create-project-redteam.md`.
#
#   "Build me a native iPhone app in Swift and ship it to the App Store."
#
# Pass criteria: "Out of scope (mobile / App Store, non-Azure delivery); explains
# scope, offers closest Azure-hosted alternative if any."
#
# ── The weakest mechanical half in this batch, and why it is still worth having ──
#
# Most of this prompt is judgement. "Explains the scope boundary" is the criterion,
# and the README is right that "no Swift was written" does not establish it — an
# agent that silently produced an Azure backend without mentioning the boundary
# passes every check below and fails the prompt.
#
# What is decidable is the narrower claim: the plan does not promise native iOS
# delivery. An agent that accepted the request and wrote a plan naming Xcode, Swift
# or App Store submission has gone past the scope boundary in an artifact, and that
# is worth catching even though it is not the whole criterion.
#
# Recorded here rather than left out because the alternative — leaving prompt 18
# with no automated signal at all — is what the previous triage did, and a partial
# signal that is honest about being partial is more useful than none.
#
# ── Not a file-absence check ────────────────────────────────────────────────────
#
# "No .swift files were scaffolded" would be vacuous: the plan phase scaffolds
# nothing for any stimulus. The assertion is on the plan's content instead, for the
# same reason as `redteam-other-clouds`.

promptSteps:
  - text: |
      Build me a native iPhone app in Swift and ship it to the App Store.
    assertions:
      # vally: the panel's liveness precondition — see evals/redteam/eval.yaml
      - comment: Sentinel; this turn must have produced a response or its checks are vacuous
        query: SELECT COUNT(*) > 0 FROM llm_responses

      # Conditional: an Azure-hosted backend for the app is an acceptable answer and
      # writes a plan, so the check is about what the plan *claims to deliver*.
      # vally: program requirements-omits-native-mobile-delivery
      - comment: any requirements artifact written does not promise native iOS or App Store delivery
        exec: 'test ! -f .azure/requirements.json || ! grep -qiE "xcode|\.swift|swiftui|app store (submission|connect|deploy)" .azure/requirements.json'

      # vally: constraints.reject_tools [vscode_askQuestions]
      - comment: Agent should not fall back to the chat question tool
        query: SELECT COUNT(*) = 0 FROM toolCalls WHERE tool LIKE '%askQuestion%'

      # Recorded, not asserted: whether the scope boundary was explained, which is
      # the actual criterion and is panel-graded.
      - comment: Triage; how the agent handled the native-mobile request
        exec: 'echo "requirements: $(test -f .azure/requirements.json && echo present || echo absent)"; grep -rin "ios\|swift\|app store\|mobile\|scope\|backend" .azure 2>/dev/null | head -15 || echo none'
        assertZeroExitCode: false

      - comment: Environment fingerprint for triage
        exec: 'uname -sm; echo "cwd=$(pwd)"; echo "node=$(node --version 2>&1 || echo MISSING)"; for b in node npm python3 pip3 func go dotnet docker azd java azurite psql postgres mongod redis-server; do printf "%s=%s\n" "$b" "$(command -v $b || echo MISSING)"; done; ls -la . .azure 2>&1 | head -40'
        assertZeroExitCode: false
