# Red-team prompt 20 (category E — naive / out-of-scope), from
# `copilot-create-project-redteam.md`.
#
#   "app"
#
# Pass criteria: "Asks clarifying requirements via the requirements webview rather
# than guessing wildly; no crash/empty plan."
#
# ── This one is almost entirely mechanical, which the original triage missed ─────
#
# `README-redteam.md` filed it under "asks clarifying questions rather than guessing
# wildly" — phrased that way it sounds like a judgement. But the product has a
# *mechanism* for clarification, and the criterion names it: the requirements
# webview. Whether the agent opened it is a tool call, not an opinion.
#
# So this asserts the positive — the webview was opened — rather than trying to
# measure "wildness". An agent that invented a detailed project from one word
# without gathering requirements fails, and one that asked in plain chat instead
# fails the askQuestion constraint. Between them they cover the criterion.
#
# ── The assertions are positive, so the sentinel is doing less work here ─────────
#
# Unlike most of this suite, the checks below are not satisfied by a run in which
# nothing happened: a workspace with no tool calls fails the webview assertion
# directly. The sentinel is kept anyway, because it distinguishes "the agent ran and
# did not open the webview" from "the agent never ran", and those want different
# follow-ups.

promptSteps:
  - text: |
      app
    assertions:
      # vally: the panel's liveness precondition — see evals/redteam/eval.yaml
      - comment: Sentinel; this turn must have produced a response or its checks are vacuous
        query: SELECT COUNT(*) > 0 FROM llm_responses

      # The criterion, as a tool call. This is the product's clarification mechanism.
      # vally: tool-calls required [workflow-tools-open_requirements_view]
      - comment: Agent should have opened the requirements webview
        query: SELECT COUNT(*) > 0 FROM toolCalls WHERE tool LIKE '%open_requirements_view%'

      # The other half of "asks clarifying requirements": not in plain chat.
      # vally: constraints.reject_tools [vscode_askQuestions]
      - comment: Agent should not fall back to the chat question tool
        query: SELECT COUNT(*) = 0 FROM toolCalls WHERE tool LIKE '%askQuestion%'

      # Recorded, not asserted. "Guessing wildly" is a judgement about how much
      # detail the agent invented from one word, and the requirements artifact is
      # where a reviewer can see it.
      - comment: Triage; what the agent inferred from a one-word prompt
        exec: 'echo "requirements: $(test -f .azure/requirements.json && echo present || echo absent)"; head -60 .azure/requirements.json 2>/dev/null || echo "no requirements.json"'
        assertZeroExitCode: false

      - comment: Environment fingerprint for triage
        exec: 'uname -sm; echo "cwd=$(pwd)"; echo "node=$(node --version 2>&1 || echo MISSING)"; for b in node npm python3 pip3 func go dotnet docker azd java azurite psql postgres mongod redis-server; do printf "%s=%s\n" "$b" "$(command -v $b || echo MISSING)"; done; ls -la . .azure 2>&1 | head -40'
        assertZeroExitCode: false
