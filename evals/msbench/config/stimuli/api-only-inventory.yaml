# Stimulus 1.2 `api-only-inventory` from evals/project-plan/eval.yaml.
# Concatenated onto config/base.yaml by build-config.ts.
#
# Four graders plus the reject_tools constraint — no no-dotfile-requirements and
# no transcript-not-contains here, because the source spec does not ask for them.
# Assertions are mirrored one-for-one rather than levelled up across stimuli, so
# that eval.yaml stays the single source of truth.

promptSteps:
  - text: |
      I need a backend API for tracking warehouse inventory — products,
      quantities, locations. Just the API, no UI needed. I want to use CosmosDB
      since the data structure might change a lot and I want it on Azure Functions.
    assertions:
      # vally: file-exists .azure/requirements.json
      - comment: Agent should have written the requirements artifact
        query: SELECT COUNT(*) > 0 FROM files WHERE path LIKE '%.azure/requirements.json'

      # vally: program requirements-api-only
      # The semantic core of this stimulus: "just the API, no UI" must land as zero
      # frontend services, and the datastore recommendation must name both Cosmos
      # and Blob. None of that is expressible in SQL without reimplementing the
      # validator, which is precisely why it runs as `exec:`.
      - comment: requirements.json describes an API-only Cosmos + Blob project
        exec: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON /agent/assets/graders/evals/graders/validate-requirements.ts --assert-no-frontend --assert-blob-storage --assert-cosmosdb

      # vally: tool-calls required [workflow-tools-open_requirements_view]
      - comment: Agent should have opened the requirements webview
        query: SELECT COUNT(*) > 0 FROM toolCalls WHERE tool LIKE '%open_requirements_view%'

      # vally: file-not-exists (no-premature-plan) — the approval gate
      - comment: Agent should not have generated a plan before requirements were confirmed
        query: SELECT COUNT(*) = 0 FROM files WHERE path LIKE '%.azure/project-plan.md'

      # vally: constraints.reject_tools [vscode_askQuestions]
      - comment: Agent should not fall back to the chat question tool
        query: SELECT COUNT(*) = 0 FROM toolCalls WHERE tool LIKE '%askQuestion%'

      # Recorded, not asserted. See config/stimuli/photo-app-requirements.yaml.
      - comment: Environment fingerprint for triage
        exec: 'sh /tmp/env-fingerprint.sh 2>&1 || { uname -sm; echo "env-fingerprint=MISSING, see customScript/output.log"; }'
        assertZeroExitCode: false
