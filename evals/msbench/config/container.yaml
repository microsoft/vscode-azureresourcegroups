# What the MSBench container actually has on PATH.
#
# This file exists so that "this stack needs a binary we do not have" is a
# millisecond-scale error on a developer machine, instead of a discovery made
# forty minutes into a run that has already been paid for.
#
# Three states, and the third is the one that earns the file:
#
#   present      — on PATH. Nothing to do.
#   absent       — not on PATH, but installable in the run preamble. `install:`
#                  carries the command, so the resulting NOT_APPLICABLE red is
#                  one actionable line rather than an investigation. A stack may
#                  require one of these only if it also declares the matching
#                  `knownGaps` entry, which is what keeps the red *expected*
#                  rather than mysterious.
#   unavailable  — there is no practical path to having it here. A stack that
#                  requires one is rejected outright; no run is submitted.
#
# ## `evidence:` — read this before trusting a row
#
# Every row says whether it was **measured** in the container or merely
# **asserted** from documentation. Most of this file is currently `asserted`:
# it comes from the project brief and from msbench/README.md, both of which are
# prose written by people (including us) repeating each other. Prose is how an
# assumption survives being wrong.
#
# Making a row `measured` costs nothing. Every stimulus already ends with an
# `Environment fingerprint for triage` exec: assertion that runs shell in the
# container with `assertZeroExitCode: false` — recorded, never asserted on.
#
# That line now covers the emulators too:
#
#   for b in ... func ... azurite psql postgres mongod redis-server
#
# so the next run anybody submits, for any reason, returns the real inventory as
# a free rider. That matters most for the rows this file does NOT yet carry: no
# datastore server has ever been observed here, and `runtime-crud` stands down on
# `datastoreRequiresContainer` reasoning from the *absence of Docker* rather than
# from having looked. The next fingerprint settles whether a datastore could be
# installed directly, without a container, which is a different question.
#
# Rows are deliberately not added for those binaries ahead of the measurement.
# Writing `azurite: absent` now would be exactly the `asserted` hypothesis this
# section warns about, dressed as a fact.
#
# Consumed by evals/src/containerInventory.ts. Checked by `npm run stacks:check`.

schemaVersion: 1

# Bumped whenever a row moves between statuses or gains measurement.
verifiedOn: '2026-08-28'

binaries:
  # Measured: msbench/README.md records "Verified in the container: Node
  # v22.22.2 on Linux x86_64", which is past the 22.18 cutoff where TypeScript
  # type-stripping is on by default. That is why the graders run off source.
  #
  # The version is the stock image's. Our custom image reports 22.23.2, because
  # `nvm install 22` in Dockerfile.vscbench resolves to whatever the latest 22.x
  # is on the day it is built. Worth knowing before quoting any row here as a
  # fact about both images: they share a Dockerfile, not a build date.
  node:
    status: present
    version: 22.22.2
    evidence: measured

  npm:
    status: present
    evidence: measured

  # Present, but see `pip` below — a Python interpreter you cannot install
  # packages into runs the standard library and nothing else, which is the
  # single fact standing between us and a Python stack.
  python3:
    status: present
    version: '3.10'
    evidence: measured

  az:
    status: present
    evidence: asserted

  git:
    status: present
    evidence: asserted

  make:
    status: present
    evidence: asserted

  gcc:
    status: present
    evidence: asserted

  curl:
    status: present
    evidence: asserted

  # The most consequential row in the file. Every stimulus we run today is Azure
  # Functions, so all five runtime-* gates emit `functionsHostUnavailable` on
  # every single run — the 0-for-N pattern that gate-health.ts exists to flag,
  # except here the gates are fine and the container is the problem.
  #
  # `config/phases/local.yaml` runs the command below in its preamble. Run
  # 2026082682123151 measured the result for the first time, and it FAILED:
  #
  #     npm error code E401
  #     npm error Unable to authenticate, your authentication token seems to be invalid.
  #
  # So the install command recorded here is not sufficient on its own. The failure
  # is registry authentication, not the package, the platform or `--unsafe-perm`:
  # npm itself works in this image, since `validate-project-builds` runs `npm ci`
  # in it. The preamble now retries against the public registry explicitly, which
  # is the next thing to measure.
  #
  # `evidence` is now `measured`: run 2026082762322354's fingerprint reported
  # `func=MISSING` directly, so the absence is observed rather than inherited from
  # documentation. The install failing is a separate measurement, above.
  #
  # ── Solved, but deliberately still `absent` here ────────────────────────────
  #
  # `container/` now builds an image that carries func 4.14.0, and run
  # 2026082777513216 measured it in the container:
  #
  #     + command -v func
  #     ++ func --version
  #     + echo 'func already present: 4.14.0'
  #
  # The agent then ran `func init services/functions --typescript --model V4`.
  #
  # This row still says `absent` because it describes the STOCK image, which is
  # what a run gets unless its dataset row names our registry. Flipping it to
  # `present` would let a stack require func without declaring the matching
  # knownGap, and that stack would then fail on the default image with exactly
  # the mysterious red this file exists to prevent. The custom image is opt-in
  # per instance, so the conservative default is the true one.
  #
  # See container/README.md for the registry setup that makes the image usable.
  func:
    status: absent
    install: npm install -g azure-functions-core-tools@4 --unsafe-perm true
    evidence: measured

  # `install: unverified` means: we believe it is absent, and we have not
  # established that installing it works. That is deliberately not the same as
  # `unavailable` — it is an unanswered question, not a closed door, and a stack
  # requiring one should expect to answer it before the schema will let it run.
  pip:
    status: absent
    install: unverified
    evidence: measured

  dotnet:
    status: absent
    install: unverified
    evidence: measured

  go:
    status: absent
    install: unverified
    evidence: measured

  azd:
    status: absent
    install: unverified
    evidence: measured

  java:
    status: absent
    install: unverified
    evidence: measured

  # ── Datastore emulators ──────────────────────────────────────────────────────
  #
  # Measured twice, by independent methods that agree. First by inspecting the
  # image directly (`az acr run`, 2026-08-28), then by the environment fingerprint
  # in run 2026082863403911 — which is the stronger of the two, because it observes
  # the container the eval actually ran in rather than one started separately.
  # Both report all five of `azurite`, `psql`, `postgres`, `mongod` and
  # `redis-server` MISSING.
  #
  # Only two get rows: the other three name datastores no stack can declare, since
  # DatastoreKind is `none | postgres | cosmos | blob | queue`, and a row nothing
  # can require is noise.
  #
  # This closes a real gap in what the suite knew about itself. `runtime-crud`
  # stands down with `datastoreRequiresContainer`, and that reason was derived
  # from the absence of *Docker* rather than from anyone checking whether a
  # datastore was present or installable. Now it has been checked.
  # Both are `install: unverified` rather than carrying a command, and the reason
  # is measured. `npm root -g` inside the image resolves to a real writable path
  # (`/opt/nvm/.../lib/node_modules`), so `npm install -g azurite` would very
  # likely work at IMAGE BUILD time — but `install:` documents the *run preamble*,
  # and npm in the preamble is measured-broken with `E401 Unable to authenticate`
  # (see the func row). Writing a command here that we know fails in the place
  # this field describes would be worse than admitting the question is open.
  #
  # ── Solved on the custom image, deliberately still `absent` here ─────────────
  #
  # The paragraph that used to end this section said Postgres was "the harder one
  # either way: a server has to be *running* while the agent works, and the image's
  # setup script only runs at build time". The first clause is true and the second
  # is a build-time/run-time split rather than a wall — the phase preamble in
  # `config/phases/local.yaml` runs inside the container before the agent starts,
  # which is exactly where a service gets started. So the image installs and the
  # preamble starts, and neither emulator needs Docker, which is what had made
  # `datastoreRequiresContainer` look like a closed door.
  #
  # Measured in image msbench-1.1.0 (`az acr run`, 2026-08-29), running the
  # preamble's own emulator block verbatim:
  #
  #     EMU_AZURITE      listening_10000
  #     EMU_POSTGRES     ready_5432
  #     EMU_PG_TCP       reachable
  #     EMU_PG_ROUNDTRIP 42     <- CREATE TABLE + INSERT + SELECT as taskuser
  #
  # These rows still say `absent` for the same reason the `func` row does: they
  # describe the STOCK image, which is what a run gets unless its dataset row names
  # our registry. Flipping them to `present` would let a stack require a datastore
  # without declaring the matching knownGap, and that stack would then fail on the
  # default image with exactly the mysterious red this file exists to prevent.
  #
  # `runtime-crud` therefore does not consult this file to decide whether to stand
  # down. It probes the datastore's port at run time (`datastoreServerReachable` in
  # src/runtime/runtimeGates.ts), so the custom image is detected by observation
  # instead of by configuration that would have to be kept in sync with it.
  azurite:
    status: absent
    install: unverified
    evidence: measured

  postgres:
    status: absent
    install: unverified
    evidence: measured

  # The closed door, and now a measured one. Not merely missing: a container
  # runtime inside the eval container is not practically installable, so a stack
  # whose datastore needs one (the `datastoreRequiresContainer` reason code)
  # cannot be made to work by trying harder. Rejected at build time rather than
  # discovered at runtime.
  #
  # msbench-cli has a `--dind` flag ("Enable Docker-in-Docker"), which looked like
  # it might reopen the door and retire that reason code outright. Run
  # 2026082762322354 submitted with `--dind` to the default ces-dev1 backend: the
  # flag was accepted, the run resolved 100%, and the fingerprint still reported
  # `docker=MISSING`. So it does not reach the agent's container here — the
  # neighbouring `--keep_container` is documented "Only valid with --backend
  # local", and this behaves the same way.
  #
  # Worth writing down because the flag's existence is a standing invitation to
  # assume the problem is solved by one argument. It is not, on this backend.
  docker:
    status: unavailable
    note: a container runtime is not practically installable inside the MSBench container
    evidence: measured
