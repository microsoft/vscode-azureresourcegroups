name: copilot-on-rails-qualitative-supplemental
description: Supplemental, uncalibrated user-satisfaction review; never a release authority.
version: "1"
type: capability
tags:
  component: copilot-on-rails
  plane: vally-native
  authority: supplemental-uncalibrated
defaults:
  runs: 1
  timeout: 60m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
  executor: cor-aca
stimuli:
  - name: api-csharp-functions-sql
    prompt: Build a backend-only C# Azure Functions API for managing warehouse inventory with CRUD endpoints, Azure SQL persistence, no authentication, and xUnit tests.
    tags:
      archetype: api
      frontend: none
      backend: csharp-functions
      database: azure-sql
      auth: none
      complexity: medium
      scenarioId: api-csharp-functions-sql
      arm: rails
      endpoint: local
      model: gpt-5.6-sol
      qualitative: supplemental
      validationCommandTimeoutMinutes: "10"
    environment:
      env:
        COR_EVAL_SCENARIO_ID: api-csharp-functions-sql
        COR_EVAL_MODEL: gpt-5.6-sol
        COR_EVAL_ARM: rails
        COR_EVAL_ENDPOINT: local
    supported_executors:
      - cor-aca
    artifacts:
      include:
        - trajectory.json
        - workspace.diff
        - reports/**
    rubric:
      - The delivered project completely satisfies the stated user request.
      - The project is understandable, locally operable, maintainable, and ready for the user to continue.
      - The trajectory and diff provide concrete evidence for claims; unsupported claims do not earn credit.
    graders:
      - type: prompt
        name: user-satisfaction-prompt
        config:
          prompt: Score only the end-user experience shown by the trajectory and workspace diff. A satisfied user can understand the result, run it locally, verify it, and continue editing it without hidden manual repair. Penalize unclear instructions, incomplete implementation, incoherent architecture, inaccessible UX, or unverifiable claims. Do not require or infer deployment evidence for an ordinary local trial. This score is supplemental and must never override executable authoritative hard gates.
          model: gpt-5.6-sol
          scoring: scale_1_5
          threshold: 0.75
          evidence:
            - trajectory
            - diff
      - type: panel
        name: user-satisfaction-panel
        config:
          prompt: Score only the end-user experience shown by the trajectory and workspace diff. A satisfied user can understand the result, run it locally, verify it, and continue editing it without hidden manual repair. Penalize unclear instructions, incomplete implementation, incoherent architecture, inaccessible UX, or unverifiable claims. Do not require or infer deployment evidence for an ordinary local trial. This score is supplemental and must never override executable authoritative hard gates.
          models: &a1
            - gpt-5.6-sol
            - claude-sonnet-5
            - gpt-5.4-mini
          aggregation: median
          scoring: scale_1_5
          threshold: 0.75
          overall_threshold: 0.75
          evidence:
            - trajectory
            - diff
          criteria:
            - name: task-satisfaction
              description: The output fulfills the explicit request without user repair.
              weight: 0.4
              pass_threshold: 0.75
              required: true
            - name: local-operability
              description: The user can build, test, run, and debug from supplied assets.
              weight: 0.35
              pass_threshold: 0.75
              required: true
            - name: clarity-and-coherence
              description: The implementation and guidance are coherent, accessible, and maintainable.
              weight: 0.25
              pass_threshold: 0.75
              required: true
