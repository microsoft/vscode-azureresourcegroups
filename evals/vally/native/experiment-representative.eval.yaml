name: copilot-on-rails-representative-experiment
description: Backend-owned Copilot on Rails experiment plan with neutral stimuli.
version: "1"
type: capability
tags:
  component: copilot-on-rails
  plane: vally-native
  authority: local-authoritative-hard-gate
  evidenceTier: ordinary
defaults:
  runs: 1
  timeout: 60m
  model: gpt-5.6-sol
  executor: mock
environment:
  env:
    COR_EVAL_MODEL: gpt-5.6-sol
    COR_EVAL_ARM: rails
    COR_EVAL_ENDPOINT: local
stimuli:
  - name: api-ts-functions-minimal
    prompt: Execute the selected Copilot on Rails scenario using the explicitly configured arm, endpoint, and model.
    tags:
      archetype: api
      frontend: none
      backend: typescript-functions
      database: none
      auth: none
      complexity: low
      scenarioId: api-ts-functions-minimal
      endpoint: local
      backendAuthoritative: "true"
      profile: minimal
      validationCommandTimeoutMinutes: "5"
      applicability-planning: not-applicable
      applicability-scaffold: required
      applicability-build: required
      applicability-test: required
      applicability-integration: required
      applicability-local-runtime: required
      applicability-browser: not-applicable
      applicability-accessibility: not-applicable
      applicability-persistence: not-applicable
      applicability-worker: not-applicable
      applicability-debugger: not-applicable
      applicability-deployment: not-applicable
      applicability-security: not-applicable
      applicability-cleanup: required
      applicability-model: required
      applicability-provenance: required
    environment:
      env:
        COR_EVAL_SCENARIO_ID: api-ts-functions-minimal
    artifacts:
      include:
        - cor-validation.json
        - custom_metrics.json
        - trajectory.json
        - workspace.diff
        - validation-manifest.json
        - native-summary.json
        - run-result.json
        - adapter-metrics.json
        - reports/**
      exclude:
        - "**/*.secret"
        - "**/.env*"
    graders:
      - type: custom-metrics
        name: backend-authoritative-metric
        config:
          path: custom_metrics.json
          assertions:
            - metric: authoritative_hard_gates_passed
              equals: true
  - name: crud-react-functions-postgres
    prompt: Execute the selected Copilot on Rails scenario using the explicitly configured arm, endpoint, and model.
    tags:
      archetype: crud
      frontend: react
      backend: functions
      database: postgres
      auth: mock
      complexity: medium
      scenarioId: crud-react-functions-postgres
      endpoint: local
      backendAuthoritative: "true"
      profile: standard
      validationCommandTimeoutMinutes: "10"
      applicability-planning: not-applicable
      applicability-scaffold: required
      applicability-build: required
      applicability-test: required
      applicability-integration: required
      applicability-local-runtime: required
      applicability-browser: required
      applicability-accessibility: required
      applicability-persistence: required
      applicability-worker: not-applicable
      applicability-debugger: required
      applicability-deployment: not-applicable
      applicability-security: not-applicable
      applicability-cleanup: required
      applicability-model: required
      applicability-provenance: required
    environment:
      env:
        COR_EVAL_SCENARIO_ID: crud-react-functions-postgres
    artifacts:
      include:
        - cor-validation.json
        - custom_metrics.json
        - trajectory.json
        - workspace.diff
        - validation-manifest.json
        - native-summary.json
        - run-result.json
        - adapter-metrics.json
        - reports/**
      exclude:
        - "**/*.secret"
        - "**/.env*"
    graders:
      - type: custom-metrics
        name: backend-authoritative-metric
        config:
          path: custom_metrics.json
          assertions:
            - metric: authoritative_hard_gates_passed
              equals: true
  - name: multiservice-react-functions-worker-postgres-queue
    prompt: Execute the selected Copilot on Rails scenario using the explicitly configured arm, endpoint, and model.
    tags:
      archetype: multiservice
      frontend: react
      backend: typescript-python-functions
      database: postgres-queue
      auth: mock
      complexity: high
      scenarioId: multiservice-react-functions-worker-postgres-queue
      endpoint: local
      backendAuthoritative: "true"
      profile: advanced
      validationCommandTimeoutMinutes: "15"
      applicability-planning: not-applicable
      applicability-scaffold: required
      applicability-build: required
      applicability-test: required
      applicability-integration: required
      applicability-local-runtime: not-applicable
      applicability-browser: not-applicable
      applicability-accessibility: not-applicable
      applicability-persistence: not-applicable
      applicability-worker: not-applicable
      applicability-debugger: not-applicable
      applicability-deployment: not-applicable
      applicability-security: not-applicable
      applicability-cleanup: required
      applicability-model: required
      applicability-provenance: required
    environment:
      env:
        COR_EVAL_SCENARIO_ID: multiservice-react-functions-worker-postgres-queue
    artifacts:
      include:
        - cor-validation.json
        - custom_metrics.json
        - trajectory.json
        - workspace.diff
        - validation-manifest.json
        - native-summary.json
        - run-result.json
        - adapter-metrics.json
        - reports/**
      exclude:
        - "**/*.secret"
        - "**/.env*"
    graders:
      - type: custom-metrics
        name: backend-authoritative-metric
        config:
          path: custom_metrics.json
          assertions:
            - metric: authoritative_hard_gates_passed
              equals: true
