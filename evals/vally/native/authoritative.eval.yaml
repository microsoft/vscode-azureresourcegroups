name: copilot-on-rails-authoritative
description: Direct Copilot on Rails execution with fail-closed authoritative artifact grading.
version: "1"
type: capability
tags:
  component: copilot-on-rails
  plane: vally-native
  authority: local-authoritative-hard-gate
  evidenceTier: ordinary
defaults:
  runs: 1
  timeout: 60m
  model: gpt-5.6-sol
  executor: cor-aca
stimuli:
  - name: api-csharp-functions-sql
    prompt: Build a backend-only C# Azure Functions API for managing warehouse inventory with CRUD endpoints, Azure SQL persistence, no authentication, and xUnit tests.
    tags:
      archetype: api
      frontend: none
      backend: csharp-functions
      database: azure-sql
      auth: none
      complexity: medium
      scenarioId: api-csharp-functions-sql
      endpoint: local
      arm: rails
      model: gpt-5.6-sol
      profile: standard
      validationCommandTimeoutMinutes: "10"
      applicability-planning: required
      applicability-scaffold: required
      applicability-build: required
      applicability-test: required
      applicability-integration: required
      applicability-local-runtime: required
      applicability-browser: not-applicable
      applicability-browser-journey: not-applicable
      applicability-accessibility: not-applicable
      applicability-persistence: not-applicable
      applicability-worker: not-applicable
      applicability-debugger: not-applicable
      applicability-deployment: not-applicable
      applicability-security: not-applicable
      applicability-cleanup: required
      applicability-model: required
      applicability-provenance: required
    environment:
      env:
        COR_EVAL_SCENARIO_ID: api-csharp-functions-sql
        COR_EVAL_MODEL: gpt-5.6-sol
        COR_EVAL_ARM: rails
        COR_EVAL_ENDPOINT: local
    supported_executors:
      - cor-aca
    artifacts:
      include:
        - cor-validation.json
        - custom_metrics.json
        - trajectory.json
        - workspace.diff
        - validation-manifest.json
        - native-summary.json
        - run-result.json
        - adapter-metrics.json
        - reports/**
      exclude:
        - "**/*.secret"
        - "**/.env*"
    graders:
      - type: cor-authoritative
        name: authoritative-local-hard-gates
        config:
          validationPath: cor-validation.json
          metricsPath: custom_metrics.json
          requiredGates:
            - planning
            - scaffold
            - build
            - test
            - integration
            - local-runtime
            - cleanup
            - model
            - provenance
          evidenceTier: ordinary
      - type: custom-metrics
        name: authoritative-metric
        config:
          path: custom_metrics.json
          assertions:
            - metric: authoritative_hard_gates_passed
              equals: true
