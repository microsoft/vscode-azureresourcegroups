name: cor-node-functions-sandbox

services:
  dev-volume-init:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R node:node /workspaces/copilot-on-rails-sandbox/node_modules
    volumes:
      - sandbox_node_modules:/workspaces/copilot-on-rails-sandbox/node_modules

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspaces/copilot-on-rails-sandbox
    volumes:
      - .:/workspaces/copilot-on-rails-sandbox
      - sandbox_node_modules:/workspaces/copilot-on-rails-sandbox/node_modules
    env_file:
      - .env.example
    depends_on:
      dev-volume-init:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
      - "${FUNCTIONS_PORT:-7071}:7071"
      - "127.0.0.1:${NODE_INSPECTOR_PORT:-9229}:9229"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/cor-sandbox-ready"]
      interval: 2s
      timeout: 2s
      retries: 90

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      - --skipApiVersionCheck
    volumes:
      - azurite_data:/data
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_TABLE_PORT:-10002}:10002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('net');const socket=net.connect(10000,'127.0.0.1');
          socket.on('connect',()=>{socket.end();process.exit(0)});
          socket.on('error',()=>process.exit(1));
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    env_file:
      - .env.example
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  azurite_data:
  postgres_data:
  sandbox_node_modules:
